services:
  - type: web
    name: secureledger-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /login
    # Calls the Prisma CLI directly with absolute paths: no shell builtin and no npx, so the
    # command does not depend on the working directory or on npm starting up in the container.
    preDeployCommand: node /repo/node_modules/prisma/build/index.js migrate deploy --schema /repo/packages/db/prisma/schema.prisma
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secureledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CHECKPOINT_PUBLIC_KEY
        sync: false
      - key: LEDGER_AUTH_KEY
        sync: false
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # Password reset email. Without these, production creates no reset links at all.
      - key: MAIL_PROVIDER
        value: brevo
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: worker
    name: secureledger-checkpoint-worker
    runtime: docker
    dockerfilePath: ./apps/checkpoint-worker/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secureledger-db
          property: connectionString
      - key: CHECKPOINT_PRIVATE_KEY
        sync: false
      - key: LEDGER_AUTH_KEY
        sync: false
      - key: CHECKPOINT_POLL_INTERVAL_MS
        value: "10000"
      - key: CHECKPOINT_MAX_INTERVAL_MS
        value: "30000"
      - key: CHECKPOINT_BATCH_THRESHOLD
        value: "500"
      - key: VERIFICATION_INTERVAL_MS
        value: "3600000"
      - key: NODE_ENV
        value: production

databases:
  - name: secureledger-db
    databaseName: secureledger
    user: secureledger
    plan: basic-256mb
    region: frankfurt
